name: Build LXD Image

on:
  push:
    branches:
      - lxd_tests
  workflow_dispatch:

env:
  PRODUCT_VERSION: "1.10.0" # or: "latest"

jobs:
  packer:
    runs-on: ubuntu-24.04
    name: Run Packer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup `packer`
        uses: hashicorp/setup-packer@main
        id: setup
        with:
          version: ${{ env.PRODUCT_VERSION }}


      - name: Setup LXD
        uses: canonical/setup-lxd@main
        with:
          channel: latest/edge

      - name: Run `packer build`
        id: validate
        run: |
            packer plugins install github.com/hashicorp/azure 2.2.1
            packer plugins install github.com/hashicorp/lxd
            ./build-script.sh
